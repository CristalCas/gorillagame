<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦍 GorillaGame</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body {
    min-height: 100vh; color: #fff;
    background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1920&q=80') center/cover fixed no-repeat;
    position: relative; overflow-x: hidden; padding-bottom: 50px;
}
body::before {
    content: ''; position: fixed; inset: 0;
    background: linear-gradient(135deg, rgba(10,0,30,0.88), rgba(60,0,90,0.88));
    z-index: -1;
}
.header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 25px; background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);
    position: sticky; top: 0; z-index: 100;
}
.logo {
    font-size: 22px; font-weight: bold;
    background: linear-gradient(90deg, #ff8a00, #e52e71);

}
.balance-box {
    background: linear-gradient(135deg, #ff8a00, #e52e71);

    box-shadow: 0 4px 15px rgba(255,138,0,0.4);
}
.event-ticker {
    background: rgba(0,0,0,0.7); border-bottom: 1px solid rgba(255,138,0,0.3);
    padding: 8px 0; overflow: hidden; white-space: nowrap;
    position: sticky; top: 61px; z-index: 99;
}
.event-ticker-track {
    display: inline-block; padding-left: 100%;

    font-size: 13px;
}
.event-ticker-track span { margin-right: 40px; opacity: 0.85; }
@keyframes tickerMove { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
.container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
.title { font-size: 34px; text-align: center; margin-bottom: 10px; }
.title span {
    background: linear-gradient(90deg, #ff8a00, #e52e71);

}
.subtitle { text-align: center; opacity: 0.8; margin-bottom: 30px; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
.menu-btn {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 25px 15px; border-radius: 20px;

    font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;
}
.menu-btn:hover { transform: translateY(-5px); background: rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(229,46,113,0.5); }
.menu-btn .icon { font-size: 32px; }
.section {
    margin-top: 30px; padding: 25px; background: rgba(0,0,0,0.55);
    border-radius: 20px; backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
}
.section h2 { margin-bottom: 20px; text-align: center; }
.hidden { display: none !important; }
.cases-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px; margin-bottom: 20px;
}
.case-card {
    padding: 20px; border-radius: 20px; text-align: center;
    cursor: pointer; transition: all 0.3s;
    background: rgba(255,255,255,0.05); border: 2px solid transparent;
}
.case-card:hover { transform: scale(1.05); }
.case-card .case-img { font-size: 60px; margin-bottom: 10px; filter: drop-shadow(0 0 15px currentColor); }
.case-card h3 { margin-bottom: 5px; font-size: 15px; }
.case-card p { font-weight: bold; color: #ff8a00; margin-bottom: 5px; }
.case-card small { opacity: 0.75; font-size: 12px; }
.case-card h3, .case-card small { color: #fff; }
.case-card p { color: #ff8a00 !important; }
.bronze { border-color: #cd7f32; } .bronze:hover { box-shadow: 0 0 30px #cd7f32; }
.silver { border-color: #c0c0c0; } .silver:hover { box-shadow: 0 0 30px #c0c0c0; }
.gold { border-color: #ffd700; } .gold:hover { box-shadow: 0 0 30px #ffd700; }
.diamond { border-color: #00d4ff; } .diamond:hover { box-shadow: 0 0 30px #00d4ff; }
.snoop { border-color: #7fff00; } .snoop:hover { box-shadow: 0 0 30px #7fff00; }
.khabib { border-color: #ff2e63; } .khabib:hover { box-shadow: 0 0 30px #ff2e63; }
.durov { border-color: #0088cc; } .durov:hover { box-shadow: 0 0 30px #0088cc; }
.legendary { border-color: #ff1493; } .legendary:hover { box-shadow: 0 0 30px #ff1493; }
.crash-box {
    text-align: center; padding: 40px 20px; background: rgba(0,0,0,0.6);
    border-radius: 20px; margin-bottom: 20px; border: 2px solid rgba(255,138,0,0.3);
}
.multiplier {
    font-size: 64px; font-weight: bold;

    margin-bottom: 10px; transition: all 0.2s;
}
.crash-status { opacity: 0.85; font-size: 16px; }
.crash-controls { display: flex; gap: 10px; margin-bottom: 15px; }
.start-btn, .stop-btn {

}
.start-btn { background: linear-gradient(135deg, #00ff88, #00b36b); color: #000; }

.start-btn:hover, .stop-btn:hover { transform: scale(1.03); }
.start-btn:disabled, .stop-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.bet-info { text-align: center; margin-bottom: 20px; opacity: 0.9; font-size: 16px; }
.bet-info b { color: #ff8a00; font-size: 20px; }
.bet-selector { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
.bet-option {
    padding: 8px 16px; border-radius: 12px;

    font-size: 14px;
}
.bet-option:hover { background: rgba(255,255,255,0.15); }
.bet-option.active { border-color: #ff8a00; background: rgba(255,138,0,0.2); box-shadow: 0 0 15px rgba(255,138,0,0.5); }
.info-card {
    text-align: center; padding: 30px 20px; background: rgba(255,138,0,0.1);
    border-radius: 15px; border: 1px solid rgba(255,138,0,0.3); margin-bottom: 20px;
}
.info-card p { margin-bottom: 20px; font-size: 18px; line-height: 1.5; }
.tg-link {
    display: inline-block; padding: 12px 30px;
    background: linear-gradient(135deg, #229ED9, #0088cc);
    color: #fff; text-decoration: none; border-radius: 30px;
    font-weight: bold; transition: all 0.3s;
}
.tg-link:hover { transform: scale(1.05); box-shadow: 0 0 25px #229ED9; }
.inventory-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 20px;
}
.inventory-item {
    padding: 12px; background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,138,0,0.4);
    border-radius: 14px; text-align: center; transition: all 0.3s;
}
.inventory-item:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255,138,0,0.4); border-color: #ff8a00; }
.inventory-item img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; filter: drop-shadow(0 0 8px rgba(255,138,0,0.5)); }
.inventory-item .nft-name { font-size: 11px; font-weight: bold; line-height: 1.3; word-break: break-word; }
.inventory-item.tier1 { border-color: #cd7f32; }
.inventory-item.tier2 { border-color: #c0c0c0; }
.inventory-item.tier3 { border-color: #ffd700; }
.inventory-item.tier4 { border-color: #00d4ff; }
.inventory-item.tier5 { border-color: #ff2e63; box-shadow: 0 0 20px rgba(255,46,99,0.4); }
.empty { opacity: 0.6; text-align: center; }
.back-btn {
    display: block; margin: 20px auto 0; padding: 12px 30px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; border-radius: 30px; cursor: pointer; font-size: 15px; transition: all 0.3s;
}
.back-btn:hover { background: rgba(255,255,255,0.2); }
.modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000; padding: 20px;
}
.modal-content {
    background: linear-gradient(135deg, #1a0033, #330066);
    padding: 40px 30px; border-radius: 25px; text-align: center;
    max-width: 400px; width: 100%; border: 2px solid #ff8a00;
    box-shadow: 0 0 50px rgba(255,138,0,0.5); animation: pop 0.4s ease;
    white-space: pre-line; position: relative; z-index: 1001;
}
@keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.modal-content h2 { margin-bottom: 15px; font-size: 26px; }
.modal-content p { margin-bottom: 25px; font-size: 18px; }
.modal-content img { width: 120px; height: 120px; object-fit: contain; margin: 10px auto; display: block; filter: drop-shadow(0 0 15px rgba(255,138,0,0.7)); }
.close-btn {
    padding: 12px 35px; background: linear-gradient(135deg, #ff8a00, #e52e71);
    border: none; color: #fff; font-weight: bold; border-radius: 30px;
    font-size: 16px; cursor: pointer; transition: all 0.3s;
}
.close-btn:hover { transform: scale(1.05); }
.profile-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 20px; background: rgba(255,255,255,0.05);
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); margin-bottom: 20px;
}
.profile-avatar {
    width: 100px; height: 100px; border-radius: 50%;

    font-size: 40px; object-fit: cover;
}
.profile-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
.profile-username { opacity: 0.7; margin-bottom: 15px; }
.profile-id { font-size: 12px; opacity: 0.5; margin-bottom: 20px; }
.profile-role { padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
.role-admin { background: linear-gradient(135deg, #ffd700, #ff8a00); color: #000; }
.role-user { background: rgba(255,255,255,0.15); color: #fff; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; }
.stat-box { padding: 15px 10px; background: rgba(0,0,0,0.4); border-radius: 12px; text-align: center; }
.stat-box .value { font-size: 20px; font-weight: bold; color: #ff8a00; }
.stat-box .label { font-size: 11px; opacity: 0.7; margin-top: 4px; }
.upgrader-info {
    text-align: center; padding: 12px; border-radius: 12px;
    background: rgba(0,0,0,0.4); margin-bottom: 20px;
    font-size: 13px; line-height: 1.6; opacity: 0.85;
}
.upgrader-info b { color: #ff8a00; }
.upg-row { display: grid; grid-template-columns: 1fr 50px 1fr; gap: 12px; align-items: stretch; margin-bottom: 20px; }
.upg-col { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; }
.upg-col h3 { font-size: 14px; text-align: center; margin-bottom: 12px; opacity: 0.8; font-weight: normal; }
.upg-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
.upg-item {
    padding: 8px 4px; border-radius: 10px; text-align: center;
    background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
    cursor: pointer; transition: all 0.2s; font-size: 10px; font-weight: bold;
    word-break: break-word; line-height: 1.2; position: relative;
}
.upg-item:hover { background: rgba(255,255,255,0.12); transform: scale(1.05); }
.upg-item.selected { border-color: #ff8a00; background: rgba(255,138,0,0.2); box-shadow: 0 0 15px rgba(255,138,0,0.5); }
.upg-item .check-badge {
    position: absolute; top: 3px; right: 3px;
    background: #ff8a00; color: #000;
    border-radius: 50%; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold;
}
.upg-item img { width: 45px; height: 45px; object-fit: contain; display: block; margin: 0 auto 4px; }
.upg-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.upg-arrow { font-size: 28px; color: #ff8a00; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
.upg-chance { font-size: 13px; font-weight: bold; text-align: center; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,0.5); }
.upg-chance.low { color: #ff8a00; }
.upg-chance.ok { color: #4ddb99; }
.upg-chance.high { color: #00ff88; }
.upg-stake-info { text-align: center; font-size: 12px; opacity: 0.8; margin-bottom: 10px; }
.upg-result-box {
    text-align: center; padding: 15px; border-radius: 12px;
    background: rgba(0,0,0,0.4); margin-bottom: 15px;
    font-size: 14px; min-height: 45px;
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
}
.upg-result-box.win { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid #00ff88; }
.upg-result-box.lose { background: rgba(255,46,99,0.15); color: #ff2e63; border: 1px solid #ff2e63; }
.upg-result-box img { width: 40px; height: 40px; object-fit: contain; }
.upgrade-btn {
    display: block; width: 100%; padding: 18px;
    background: linear-gradient(135deg, #ff8a00, #e52e71);
    border: none; border-radius: 15px; color: #fff;
    font-size: 20px; font-weight: bold; cursor: pointer;
    transition: all 0.3s; margin-top: 10px;
}
.upgrade-btn:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 30px rgba(255,138,0,0.6); }
.upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pvp-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.pvp-player {
    padding: 15px; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 14px; cursor: pointer; transition: all 0.3s;
}
.pvp-player:hover { border-color: #ff8a00; background: rgba(255,138,0,0.08); transform: translateY(-3px); }
.pvp-player.selected { border-color: #ff8a00; box-shadow: 0 0 25px rgba(255,138,0,0.5); background: rgba(255,138,0,0.15); }
.pvp-player .p-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
.pvp-player .p-user { opacity: 0.6; font-size: 11px; margin-bottom: 8px; }
.pvp-player .p-nfts { font-size: 12px; opacity: 0.8; }
.pvp-preview {
    display: grid; grid-template-columns: 1fr auto 1fr;

}
.pvp-side { text-align: center; }
.pvp-side h4 { font-size: 12px; opacity: 0.7; margin-bottom: 10px; font-weight: normal; }
.pvp-side .pvp-nft-list { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.pvp-side .pvp-nft-mini {

.pvp-side .pvp-empty { font-size: 12px; opacity: 0.5; padding: 30px 0; }
.pvp-vs {
    font-size: 28px; font-weight: bold;
    background: linear-gradient(90deg, #ff8a00, #e52e71);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.pvp-nft-picker {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px; margin-bottom: 15px; max-height: 250px; overflow-y: auto;
    padding: 10px; background: rgba(0,0,0,0.3); border-radius: 12px;
}
.pvp-nft-pick {
    padding: 8px; border-radius: 10px; text-align: center;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    cursor: pointer; transition: all 0.2s; font-size: 10px; position: relative;
}
.pvp-nft-pick:hover { background: rgba(255,255,255,0.12); }
.pvp-nft-pick.selected { border-color: #ff8a00; background: rgba(255,138,0,0.2); box-shadow: 0 0 15px rgba(255,138,0,0.5); }
.pvp-nft-pick .check-badge {
    position: absolute; top: 3px; right: 3px;
    background: #ff8a00; color: #000;
    border-radius: 50%; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold;
}
.pvp-nft-pick img { width: 45px; height: 45px; object-fit: contain; display: block; margin: 0 auto 4px; }
.pvp-battle-btn {
    display: block; width: 100%; padding: 18px;
    background: linear-gradient(135deg, #ff2e63, #b3002d);
    border: none; border-radius: 15px; color: #fff;
    font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s;
}
.pvp-battle-btn:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 30px rgba(255,46,99,0.6); }
.pvp-battle-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pvp-result { text-align: center; padding: 20px; border-radius: 15px; margin-top: 15px; font-size: 18px; font-weight: bold; display: none; }
.pvp-result.show { display: block; animation: pop 0.4s ease; }
.pvp-result.win { background: rgba(0,255,136,0.15); color: #00ff88; border: 2px solid #00ff88; }
.pvp-result.lose { background: rgba(255,46,99,0.15); color: #ff2e63; border: 2px solid #ff2e63; }
.promo-box { display: flex; gap: 8px; margin-bottom: 20px; }
.promo-box input {
    flex: 1; padding: 15px 18px;
    background: rgba(0,0,0,0.5); border: 2px solid rgba(255,138,0,0.4);
    border-radius: 12px; color: #fff; font-size: 15px;
    text-transform: uppercase; letter-spacing: 2px;
    font-family: monospace;
}

.promo-box input::placeholder { color: rgba(255,255,255,0.35); letter-spacing: 1px; }
.promo-btn {
    padding: 15px 25px; border-radius: 12px;
    background: linear-gradient(135deg, #00ff88, #00b36b);
    border: none; color: #000; font-weight: bold; font-size: 15px;
    cursor: pointer; transition: all 0.3s;
}
.promo-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,255,136,0.5); }

    padding: 15px; background: rgba(255,255,255,0.05);

    border: 1px solid rgba(255,255,255,0.1); gap: 10px; flex-wrap: wrap;
}
.admin-user-info { flex: 1; min-width: 150px; }
.admin-user-info b { color: #ff8a00; }
.admin-user-info small { opacity: 0.6; font-size: 11px; display: block; margin-top: 2px; }
.admin-actions { display: flex; gap: 5px; flex-wrap: wrap; }

.admin-btn.take { background: #b3002d; color: #fff; }

.admin-btn:hover { transform: scale(1.05); opacity: 0.9; }
.admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
.admin-stat { padding: 20px 10px; background: rgba(255,138,0,0.15); border-radius: 12px; text-align: center; border: 1px solid rgba(255,138,0,0.3); }
.admin-stat .num { font-size: 24px; font-weight: bold; color: #ff8a00; }
.admin-stat .lbl { font-size: 11px; opacity: 0.8; margin-top: 4px; }
.admin-input input { width: 100%; padding: 10px 15px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 14px; }
.logout-btn {
    display: block; margin: 20px auto 0; padding: 10px 25px;
    background: rgba(255,46,99,0.2); border: 1px solid #ff2e63;
    color: #ff8a9e; border-radius: 30px; cursor: pointer;
    font-size: 13px; transition: all 0.3s;
}
.logout-btn:hover { background: rgba(255,46,99,0.35); }
#auth-overlay {
    position: fixed; inset: 0; z-index: 9998;
    background: linear-gradient(135deg, #0a001e, #1a0033);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 30px 15px; overflow-y: auto;

.auth-box { max-width: 420px; width: 100%; margin: auto; background: rgba(0,0,0,0.6); border: 2px solid #ff8a00; border-radius: 25px; padding: 30px 25px; box-shadow: 0 0 50px rgba(255,138,0,0.4); }
.auth-box h1 { font-size: 28px; margin-bottom: 5px; text-align: center; background: linear-gradient(90deg, #ff8a00, #e52e71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.auth-box .auth-sub { text-align: center; opacity: 0.65; margin-bottom: 20px; font-size: 13px; }
.auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 14px; }
.auth-tab { flex: 1; padding: 12px; border-radius: 10px; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
.auth-tab.active { background: linear-gradient(135deg, #ff8a00, #e52e71); box-shadow: 0 4px 15px rgba(255,138,0,0.4); }
.auth-field { margin-bottom: 12px; }
.auth-field label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 5px; padding-left: 4px; }
.auth-field input { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: #fff; font-size: 15px; transition: all 0.3s; }
.auth-field input:focus { outline: none; border-color: #ff8a00; box-shadow: 0 0 0 3px rgba(255,138,0,0.15); }
.auth-field input.invalid { border-color: #ff2e63; }
.auth-field input.valid { border-color: #00b36b; }
.auth-hint { font-size: 11px; opacity: 0.55; margin-top: 4px; padding-left: 4px; line-height: 1.4; }
.auth-hint.error { color: #ff6b8a; opacity: 1; }
.auth-hint.ok { color: #4ddb99; opacity: 1; }
.auth-error { background: rgba(255,46,99,0.2); color: #ff8a9e; padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 13px; text-align: center; display: none; line-height: 1.5; }
.auth-error.show { display: block; }
.auth-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff8a00, #e52e71); border: none; border-radius: 15px; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-top: 15px; }
.auth-btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(255,138,0,0.6); }
.role-select { display: flex; gap: 10px; margin-bottom: 15px; }
.role-option { flex: 1; padding: 15px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); cursor: pointer; transition: all 0.3s; text-align: center; }
.role-option:hover { background: rgba(255,255,255,0.1); }
.role-option.active { border-color: #ff8a00; background: rgba(255,138,0,0.15); box-shadow: 0 0 20px rgba(255,138,0,0.4); }
.role-option .role-icon { font-size: 30px; margin-bottom: 5px; }
.role-option .role-name { font-size: 13px; font-weight: bold; }
@media (max-width: 600px) {
    .title { font-size: 24px; }
    .multiplier { font-size: 48px; }
    .menu-grid { grid-template-columns: repeat(2, 1fr); }

    .upg-mid { flex-direction: row; }
    .pvp-preview { grid-template-columns: 1fr; gap: 10px; }
}

function hashPassword(pwd) {
    let h = 5381;
    const salt = 'gorilla_salt_v1';
    const str = salt + pwd + salt;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) + h) + str.charCodeAt(i);
        h = h | 0;
    }
    return 'h_' + Math.abs(h).toString(36) + '_' + str.length;
}

function validateUsername(u) {
    if (!u) return 'Введи @username';
    if (u.length < 5) return 'Минимум 5 символов';
    if (u.length > 20) return 'Максимум 20 символов';
    if (!/^[a-zA-Z0-9_]+$/.test(u)) return 'Только латиница, цифры и _';
    if (!/[a-zA-Z]/.test(u)) return 'Должна быть хотя бы одна буква';
    return null;
}

function findUserByUsername(username) {
    const lower = username.toLowerCase();
    const users = getAllUsers();
    for (const id in users) {
        if ((users[id].username || '').toLowerCase() === lower) return users[id];
    }
    return null;
}

function doRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const name = document.getElementById('reg-name').value.trim();
    const pwd = document.getElementById('reg-password').value;
    const pwd2 = document.getElementById('reg-password2').value;
    const adminCode = document.getElementById('reg-admin-code').value.trim();
    const err = document.getElementById('reg-error');
    err.classList.remove('show');
    const uErr = validateUsername(username);
    if (uErr) { err.textContent = '❌ Username: ' + uErr; err.classList.add('show'); return; }
    if (findUserByUsername(username)) { err.textContent = '❌ @' + username + ' уже занят'; err.classList.add('show'); return; }
    if (!name || name.length < 2) { err.textContent = '❌ Введи имя (мин. 2 символа)'; err.classList.add('show'); return; }
    if (pwd.length < 6) { err.textContent = '❌ Пароль минимум 6 символов'; err.classList.add('show'); return; }
    if (pwd !== pwd2) { err.textContent = '❌ Пароли не совпадают'; err.classList.add('show'); return; }
    if (selectedRole === 'admin' && adminCode !== ADMIN_CODE) { err.textContent = '❌ Неверный код админа'; err.classList.add('show'); return; }
    const id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);

        id: id, username: username, name: name,
        passwordHash: hashPassword(pwd), role: selectedRole,
        balance: START_BALANCE, nft_inventory: [], last_free_case: null,
        cases_opened: 0, blocked: false, created: Date.now(), photo_url: ''
    };
    saveAllUsers(users);
    localStorage.setItem(CURRENT_KEY, id);
    user = users[id];
    addEvent(`🆕 ${name} зарегистрировался в игре!`);
    document.getElementById('auth-overlay').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    initApp();
}

function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const pwd = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    err.classList.remove('show');
    const uErr = validateUsername(username);
    if (uErr) { err.textContent = '❌ ' + uErr; err.classList.add('show'); return; }
    if (!pwd) { err.textContent = '❌ Введи пароль'; err.classList.add('show'); return; }
    const found = findUserByUsername(username);
    if (!found) { err.textContent = '❌ Пользователь @' + username + ' не найден'; err.classList.add('show'); return; }
    if (found.passwordHash !== hashPassword(pwd)) { err.textContent = '❌ Неверный пароль'; err.classList.add('show'); return; }
    if (found.blocked) { err.textContent = '🚫 Аккаунт заблокирован админом'; err.classList.add('show'); return; }
    localStorage.setItem(CURRENT_KEY, found.id);
    user = found;
    document.getElementById('auth-overlay').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    initApp();
}

/* ================== ОТКРЫТИЕ КЕЙСА ================== */
function rollReward(rewards, caseKey) {
    const luck = getLuck();
    const luckBonus = luck[caseKey] || 0;
    const total = rewards.reduce((s, r) => s + r.chance, 0);
    const r = Math.random() * total;
    let upto = 0;
    for (const rw of rewards) {
        let chance = rw.chance;
        if (rw.nft && luckBonus) chance = chance * (1 + luckBonus / 100);
        upto += chance;
        if (r <= upto) return rw;
    }
    return rewards[rewards.length - 1];
}

function openCase(caseKey) {
    const c = CASES[caseKey];
    if (!c) return;
    if (user.balance < c.price) {
        showModal('❌ Недостаточно средств', `Нужно ${c.price} ⭐\nУ тебя: ${user.balance} ⭐`);
        return;
    }
    user.balance -= c.price;
    user.cases_opened = (user.cases_opened || 0) + 1;
    const reward = rollReward(c.rewards, caseKey);
    if (reward.nft) {
        user.nft_inventory.push(reward.name);
        showModal('🎉 ТЫ ВЫБИЛ NFT!', reward.name, reward.name);
        addEvent(`🎁 ${user.name} выбил ${reward.name}`);
    } else {
        user.balance += reward.value;
        showModal('🎁 Выпало:', reward.name);
    }
    saveUser();
    renderInventory();
}

function openFreeCase() {
    const now = Date.now();
    const DAY = 24 * 60 * 60 * 1000;
    if (user.last_free_case && now - user.last_free_case < DAY) {
        const remaining = DAY - (now - user.last_free_case);
        const h = Math.floor(remaining / 3600000);
        const m = Math.floor((remaining % 3600000) / 60000);
        showModal('⏳ Подожди', `Следующий бесплатный кейс\nчерез ${h}ч ${m}мин`);
        return;
    }
    user.last_free_case = now;
    user.cases_opened = (user.cases_opened || 0) + 1;
    const reward = rollReward(FREE_REWARDS, 'free');
    if (reward.nft) {
        user.nft_inventory.push(reward.name);
        showModal('🎉 ТЫ ВЫБИЛ NFT!', reward.name, reward.name);
        addEvent(`🎁 ${user.name} выбил ${reward.name} в бесплатном кейсе`);
    } else {
        user.balance += reward.value;
        showModal('🎁 Бесплатный кейс:', reward.name);
    }
    saveUser();
    renderInventory();
}

let crashState = { playing: false, multiplier: 1.00, crashAt: 0, interval: null, bet: 100 };

function selectBet(amount) {
    if (crashState.playing) return;
    crashState.bet = amount;
    document.querySelectorAll('.bet-option').forEach(el => {
        el.classList.toggle('active', parseInt(el.textContent) === amount);
    });
    document.getElementById('bet-display').textContent = amount;
}

function startCrash() {
    if (crashState.playing) return;
    if (user.balance < crashState.bet) {
        showModal('❌ Недостаточно средств', `Нужно ${crashState.bet} ⭐`); return;
    }
    user.balance -= crashState.bet;
    saveUser();
    crashState.playing = true;
    crashState.multiplier = 1.00;
    crashState.crashAt = 1 + Math.random() * 9;
    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;
    document.getElementById('crash-status').textContent = 'Успей нажать СТОП!';
    document.getElementById('multiplier').textContent = '1.00x';
    crashState.interval = setInterval(() => {
        crashState.multiplier += 0.1 + Math.random() * 0.3;
        document.getElementById('multiplier').textContent = crashState.multiplier.toFixed(2) + 'x';
        if (crashState.multiplier >= crashState.crashAt) crash();
    }, 400);
}

function stopCrash() {
    if (!crashState.playing) return;
    clearInterval(crashState.interval);
    crashState.playing = false;
    const win = Math.floor(crashState.bet * crashState.multiplier);
    user.balance += win;
    saveUser();
    document.getElementById('start-btn').disabled = false;
    document.getElementById('stop-btn').disabled = true;
    document.getElementById('crash-status').textContent = `✅ Выигрыш: +${win} ⭐`;
    showModal('✅ Ты остановился!', `Множитель: ${crashState.multiplier.toFixed(2)}x\nВыигрыш: +${win} ⭐`);
    addEvent(`🎮 ${user.name} выиграл ${win} ⭐ в краше (x${crashState.multiplier.toFixed(2)})`);
}

function crash() {
    clearInterval(crashState.interval);
    crashState.playing = false;
    document.getElementById('start-btn').disabled = false;
    document.getElementById('stop-btn').disabled = true;
    document.getElementById('multiplier').textContent = crashState.crashAt.toFixed(2) + 'x 💥';
    document.getElementById('crash-status').textContent = 'КРАШ! Попробуй ещё раз';
    showModal('💥 КРАШ!', `Ты потерял ${crashState.bet} ⭐\nКраш на ${crashState.crashAt.toFixed(2)}x`);
    addEvent(`💥 ${user.name} потерял ${crashState.bet} ⭐ в краше`);
}

    if (lower.includes('золотой') || lower.includes('кристалл') || lower.includes('кибер') || lower.includes('неоновое') || lower.includes('огненный') || lower.includes('радужный')) return 5;
    if (lower.includes('снуп') || lower.includes('бриллиантовое') || lower.includes('медальон') || lower.includes('хрустальный') || lower.includes('космический')) return 4;
    if (lower.includes('пепе') || lower.includes('дуров') || lower.includes('хабиб') || lower.includes('желейная') || lower.includes('платина') || lower.includes('кольцо')) return 3;
    if (lower.includes('змея') || lower.includes('круг') || lower.includes('астральный') || lower.includes('корона')) return 2;
    return 1;
}

function getNftPrice(name) {
    if (NFT_TIERS[name]) return NFT_TIERS[name].price;
    const tier = getNftTier(name);
    const prices = { 1: 120, 2: 475, 3: 2100, 4: 6500, 5: 19500 };
    return prices[tier] || 100;
}

function getTierEmoji(tier) {
    const emojis = { 1: '🟫', 2: '⬜', 3: '🟨', 4: '💎', 5: '🔥' };
    return emojis[tier] || '⬜';
}

function renderUpgMyItems() {
    const container = document.getElementById('upg-my-items');
    if (!container) return;
    if (!user.nft_inventory || !user.nft_inventory.length) {
        container.innerHTML = '<p style="grid-column:1/-1;opacity:0.6;font-size:12px;text-align:center;">Пусто. Открой кейс!</p>';
        return;
    }
    container.innerHTML = user.nft_inventory.map((nft, i) => {
        const img = getNftImage(nft);
        const selected = upgState.from.includes(i);
        return `<div class="upg-item ${selected ? 'selected' : ''}" onclick="pickMyItem(${i})">
            ${selected ? '<div class="check-badge">✓</div>' : ''}
            ${img ? `<img src="${img}" alt="">` : `<span style="font-size:20px;">${getTierEmoji(getNftTier(nft))}</span>`}

}

function renderUpgTargets() {
    const container = document.getElementById('upg-target-items');
    if (!container) return;
    container.innerHTML = ALL_TARGETS.map(name => {

}

function pickMyItem(index) {
    if (upgState.busy) return;
    const idx = upgState.from.indexOf(index);
    if (idx === -1) upgState.from.push(index);
    else upgState.from.splice(idx, 1);
    renderUpgMyItems();
    updateUpgChance();
}

function pickTarget(name) {
    if (upgState.busy) return;
    upgState.to = name;
    renderUpgTargets();
    updateUpgChance();
}

function updateUpgChance() {
    const chanceEl = document.getElementById('upg-chance-display');
    const btn = document.getElementById('upgrade-btn');
    const resultBox = document.getElementById('upg-result-box');
    const stakeInfo = document.getElementById('upg-stake-info');
    if (!chanceEl) return;
    if (!upgState.from.length || !upgState.to) {
        chanceEl.textContent = 'Выбери NFT';
        chanceEl.className = 'upg-chance';
        btn.disabled = true;
        resultBox.textContent = 'Выбери NFT слева и цель справа';
        resultBox.className = 'upg-result-box';
        if (stakeInfo) stakeInfo.textContent = '';
        return;
    }
    let totalPrice = 0;
    upgState.from.forEach(i => { totalPrice += getNftPrice(user.nft_inventory[i]); });
    const targetPrice = getNftPrice(upgState.to);
    let chance = (totalPrice / targetPrice) * 100;
    if (chance > 90) chance = 90;
    if (chance < 0.5) chance = 0.5;
    chanceEl.textContent = 'Шанс: ' + chance.toFixed(1) + '%';
    chanceEl.className = 'upg-chance ' + (chance < 15 ? 'low' : (chance < 40 ? 'ok' : 'high'));
    btn.disabled = false;
    resultBox.textContent = `Ставка: ${totalPrice}⭐ → Цель: ${upgState.to} (${targetPrice}⭐)`;
    resultBox.className = 'upg-result-box';
    if (stakeInfo) stakeInfo.textContent = `Выбрано NFT: ${upgState.from.length}`;
}

function doUpgrade() {
    if (upgState.busy || !upgState.from.length || !upgState.to) return;
    let totalPrice = 0;
    upgState.from.forEach(i => { totalPrice += getNftPrice(user.nft_inventory[i]); });
    const targetPrice = getNftPrice(upgState.to);
    let chance = (totalPrice / targetPrice) * 100;
    if (chance > 90) chance = 90;
    if (chance < 0.5) chance = 0.5;
    upgState.busy = true;
    document.getElementById('upgrade-btn').disabled = true;
    const resultBox = document.getElementById('upg-result-box');
    resultBox.textContent = '⚡ Крутим...';
    resultBox.className = 'upg-result-box';
    let ticks = 0;
    const interval = setInterval(() => {
        const randomNft = ALL_TARGETS[Math.floor(Math.random() * ALL_TARGETS.length)];
        const img = getNftImage(randomNft);
        resultBox.innerHTML = `🎲 ${img ? `<img src="${img}" style="width:30px;height:30px;vertical-align:middle;">` : ''} ${escapeHtml(randomNft)}`;
        ticks++;
        if (ticks >= 12) { clearInterval(interval); finishUpgrade(chance); }
    }, 80);
}

function finishUpgrade(chance) {
    const success = Math.random() * 100 < chance;
    const resultBox = document.getElementById('upg-result-box');
    const users = getAllUsers();
    const currentUser = users[user.id];
    const staked = upgState.from.map(i => currentUser.nft_inventory[i]).filter(Boolean);
    // Удаляем по индексам с конца
    const indices = upgState.from.slice().sort((a,b) => b - a);
    indices.forEach(i => currentUser.nft_inventory.splice(i, 1));
    if (success) {
        currentUser.nft_inventory.push(upgState.to);
        const img = getNftImage(upgState.to);
        resultBox.innerHTML = `🎉 УСПЕХ! Получен ${img ? `<img src="${img}" style="width:30px;height:30px;vertical-align:middle;">` : ''} ${escapeHtml(upgState.to)}`;
        resultBox.className = 'upg-result-box win';
        addEvent(`⚡ ${currentUser.name} апгрейднул ${staked.length} NFT → ${upgState.to}`);
    } else {
        resultBox.textContent = `💥 ПРОВАЛ! ${staked.length} NFT сгорели`;
        resultBox.className = 'upg-result-box lose';
        addEvent(`💥 ${currentUser.name} потерял ${staked.length} NFT в апгрейдере`);
    }
    user = currentUser;
    saveAllUsers(users);
    document.getElementById('balance').textContent = user.balance;
    updateProfileUI();
    renderInventory();
    upgState.from = [];
    upgState.to = null;
    upgState.busy = false;
    renderUpgMyItems();
    renderUpgTargets();
    updateUpgChance();
    document.getElementById('upgrade-btn').disabled = true;
}

/* ================== PVP ================== */
let pvpState = { targetId: null, myNfts: [], enemyNfts: [], busy: false };

function renderPvpPlayers() {
    const container = document.getElementById('pvp-players');
    if (!container) return;
    const users = getAllUsers();
    const others = Object.values(users).filter(u => u.id !== user.id && !u.blocked);
    if (!others.length) {
        container.innerHTML = '<p class="empty">Пока нет других игроков.</p>';
        return;
    }
    container.innerHTML = others.map(u => {
        const selected = pvpState.targetId === u.id;
        const nftCount = (u.nft_inventory || []).length;
        const badge = nftCount === 0 ? ' ❌ нет NFT' : ` 🐒 ${nftCount} NFT`;
        return `<div class="pvp-player ${selected ? 'selected' : ''}" onclick="pickPvpTarget('${u.id}')">
            <div class="p-name">${escapeHtml(u.name)}</div>
            <div class="p-user">@${escapeHtml(u.username)}${badge}</div>
            <div class="p-nfts">💰 ${u.balance} ⭐</div>
        </div>`;
    }).join('');
}

function pickPvpTarget(id) {
    if (pvpState.busy) return;
    const users = getAllUsers();
    const target = users[id];
    if (!target || !target.nft_inventory || !target.nft_inventory.length) {
        showModal('❌ Нельзя вызвать', 'У игрока нет NFT для дуэли');
        return;
    }
    pvpState.targetId = id;
    const shuffled = [...target.nft_inventory].sort(() => Math.random() - 0.5);
    pvpState.enemyNfts = shuffled.slice(0, Math.min(3, shuffled.length));
    pvpState.myNfts = [];
    document.getElementById('pvp-battle-area').classList.remove('hidden');
    document.getElementById('pvp-result').classList.remove('show');
    renderPvpPlayers();
    renderPvpMyNfts();
    renderPvpPreview();
}

function renderPvpMyNfts() {
    const container = document.getElementById('pvp-my-nfts');
    if (!container) return;
    if (!user.nft_inventory || !user.nft_inventory.length) {
        container.innerHTML = '<p style="grid-column:1/-1;opacity:0.6;font-size:12px;text-align:center;">Пусто. Открой кейс!</p>';
        return;
    }
    container.innerHTML = user.nft_inventory.map((nft, i) => {
        const img = getNftImage(nft);
        const selected = pvpState.myNfts.includes(i);
        return `<div class="pvp-nft-pick ${selected ? 'selected' : ''}" onclick="pickPvpMyNft(${i})">
            ${selected ? '<div class="check-badge">✓</div>' : ''}
            ${img ? `<img src="${img}" alt="">` : `<span style="font-size:24px;">${getTierEmoji(getNftTier(nft))}</span>`}
            ${escapeHtml(nft)}
        </div>`;
    }).join('');
}

function pickPvpMyNft(index) {
    if (pvpState.busy) return;
    const idx = pvpState.myNfts.indexOf(index);
    if (idx === -1) pvpState.myNfts.push(index);
    else pvpState.myNfts.splice(idx, 1);
    renderPvpMyNfts();
    renderPvpPreview();
}

function renderPvpPreview() {
    const mySlot = document.getElementById('pvp-my-slot');
    const enemySlot = document.getElementById('pvp-enemy-slot');
    if (mySlot) {
        if (pvpState.myNfts.length) {
            const imgs = pvpState.myNfts.map(i => {
                const nft = user.nft_inventory[i];
                const img = getNftImage(nft);
                return img ? `<img class="pvp-nft-mini" src="${img}" alt="">` : `<div class="pvp-nft-mini" style="display:inline-flex;align-items:center;justify-content:center;">${getTierEmoji(getNftTier(nft))}</div>`;
            }).join('');
            mySlot.innerHTML = `<div class="pvp-nft-list">${imgs}</div>`;
        } else {
            mySlot.innerHTML = '<div class="pvp-empty">— выбери NFT ниже —</div>';
        }
    }
    if (enemySlot && pvpState.enemyNfts.length) {
        const imgs = pvpState.enemyNfts.map(nft => {
            const img = getNftImage(nft);
            return img ? `<img class="pvp-nft-mini" src="${img}" alt="">` : `<div class="pvp-nft-mini" style="display:inline-flex;align-items:center;justify-content:center;">${getTierEmoji(getNftTier(nft))}</div>`;
        }).join('');
        enemySlot.innerHTML = `<div class="pvp-nft-list">${imgs}</div>`;
    }
    document.getElementById('pvp-battle-btn').disabled = !pvpState.myNfts.length;
}

function startPvpBattle() {
    if (pvpState.busy || !pvpState.myNfts.length || !pvpState.targetId) return;
    pvpState.busy = true;
    document.getElementById('pvp-battle-btn').disabled = true;
    const resultEl = document.getElementById('pvp-result');
    resultEl.className = 'pvp-result';
    resultEl.classList.remove('show');
    let step = 0;
    const steps = ['⚔️ Готовимся...', '🥊 Бой начался!', '💥 Удар!', '⚡ Ещё удар!', '🔥 Судьба решается...'];
    const interval = setInterval(() => {
        resultEl.textContent = steps[step] || '...';
        resultEl.className = 'pvp-result show';
        step++;
        if (step >= steps.length) { clearInterval(interval); setTimeout(finishPvpBattle, 500); }
    }, 500);
}

function finishPvpBattle() {
    const users = getAllUsers();
    const me = users[user.id];
    const enemy = users[pvpState.targetId];
    if (!me || !enemy) return;
    const stakedMe = pvpState.myNfts.map(i => me.nft_inventory[i]).filter(Boolean);
    const stakedEnemy = [...pvpState.enemyNfts];
    const myIdx = pvpState.myNfts.slice().sort((a,b) => b - a);
    myIdx.forEach(i => me.nft_inventory.splice(i, 1));
    stakedEnemy.forEach(nft => {
        const idx = enemy.nft_inventory.indexOf(nft);
        if (idx !== -1) enemy.nft_inventory.splice(idx, 1);
    });
    const iWin = Math.random() < 0.5;
    const resultEl = document.getElementById('pvp-result');
    if (iWin) {
        me.nft_inventory.push(...stakedMe, ...stakedEnemy);
        resultEl.innerHTML = `🏆 ПОБЕДА! Забрал ${stakedEnemy.length} NFT`;
        resultEl.className = 'pvp-result show win';
        addEvent(`⚔️ ${me.name} победил ${enemy.name} в дуэли (+${stakedEnemy.length} NFT)`);
    } else {
        enemy.nft_inventory.push(...stakedMe, ...stakedEnemy);
        resultEl.innerHTML = `💥 ПОРАЖЕНИЕ! Потерял ${stakedMe.length} NFT`;
        resultEl.className = 'pvp-result show lose';
        addEvent(`⚔️ ${enemy.name} победил ${me.name} в дуэли (+${stakedMe.length} NFT)`);
    }
    users[user.id] = me;
    users[enemy.id] = enemy;
    saveAllUsers(users);
    user = me;
    document.getElementById('balance').textContent = user.balance;
    updateProfileUI();
    renderInventory();
    renderPvpPlayers();
    renderPvpMyNfts();
    pvpState.busy = false;
    pvpState.myNfts = [];
    pvpState.enemyNfts = [];
    pvpState.targetId = null;
    document.getElementById('pvp-battle-area').classList.add('hidden');
    document.getElementById('pvp-battle-btn').disabled = true;
}

/* ================== ПРОМОКОДЫ ================== */
function activatePromo() {
    const input = document.getElementById('promo-input');
    const code = (input.value || '').trim().toUpperCase();
    if (!code) { showModal('❌ Ошибка', 'Введи промокод'); return; }
    const promos = getPromos();
    if (!promos[code]) { showModal('❌ Не найден', 'Такого промокода нет'); return; }
    if (promos[code].used_by && promos[code].used_by.includes(user.id)) {
        showModal('❌ Уже использован', 'Ты уже активировал этот промокод');
        return;
    }
    const p = promos[code];
    let msg = '';
    if (p.stars > 0) { user.balance += p.stars; msg += `+${p.stars} ⭐\n`; }
    if (p.nft) { user.nft_inventory.push(p.nft); msg += `NFT: ${p.nft}\n`; }
    p.used_by = p.used_by || [];
    p.used_by.push(user.id);
    savePromos(promos);
    saveUser();
    renderInventory();
    addEvent(`🎟 ${user.name} активировал промокод ${code}`);
    showModal('🎉 Промокод активирован!', msg.trim());
    input.value = '';
}

function createPromo() {
    const code = (document.getElementById('promo-new-code').value || '').trim().toUpperCase();
    const stars = parseInt(document.getElementById('promo-new-stars').value) || 0;
    const nft = (document.getElementById('promo-new-nft').value || '').trim();
    if (!code || code.length < 3) { showModal('❌ Ошибка', 'Код минимум 3 символа'); return; }
    if (!stars && !nft) { showModal('❌ Ошибка', 'Укажи звёзды или NFT'); return; }
    const promos = getPromos();
    if (promos[code]) { showModal('❌ Ошибка', 'Такой код уже есть'); return; }
    promos[code] = { stars: stars, nft: nft, used_by: [], created: Date.now() };
    savePromos(promos);
    document.getElementById('promo-new-code').value = '';
    document.getElementById('promo-new-stars').value = '';
    document.getElementById('promo-new-nft').value = '';
    renderAdminPromos();
    showModal('✅ Промокод создан', `Код: ${code}\nЗвёзды: ${stars}\nNFT: ${nft || '—'}`);
}

function renderAdminPromos() {
    const container = document.getElementById('admin-promos');
    if (!container) return;
    const promos = getPromos();
    const list = Object.entries(promos).sort((a, b) => (b[1].created || 0) - (a[1].created || 0));
    if (!list.length) { container.innerHTML = '<p class="empty" style="margin-bottom:15px;">Промокодов нет</p>'; return; }
    container.innerHTML = list.map(([code, p]) => `
        <div class="admin-user">
            <div class="admin-user-info">
                <b>🎟 ${escapeHtml(code)}</b><br>
                ⭐ ${p.stars || 0} · 🐒 ${p.nft ? escapeHtml(p.nft) : '—'}
                <small>Использован: ${(p.used_by || []).length} раз</small>
            </div>
            <div class="admin-actions">
                <button class="admin-btn block" onclick="deletePromo('${escapeHtml(code)}')">🗑</button>
            </div>
        </div>
    `).join('');
}

function deletePromo(code) {
    if (!confirm('Удалить промокод ' + code + '?')) return;
    const promos = getPromos();
    delete promos[code];
    savePromos(promos);
    renderAdminPromos();
}

/* ================== АДМИН: ПОДКРУТКА ШАНСОВ ================== */
function renderLuckControls() {
    const container = document.getElementById('luck-controls');
    if (!container) return;
    const luck = getLuck();

/* ================== НАВИГАЦИЯ ================== */
function showSection(name) {
    document.getElementById('view-main').classList.add('hidden');
    document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
    if (name === 'main') { document.getElementById('view-main').classList.remove('hidden'); return; }
    const section = document.getElementById('section-' + name);
    if (section) section.classList.remove('hidden');
    if (name === 'profile') updateProfileUI();
    if (name === 'upgrade') {
        upgState = { from: [], to: null, busy: false };
        renderUpgMyItems();
        renderUpgTargets();
        updateUpgChance();
    }
    if (name === 'pvp') {
        pvpState = { targetId: null, myNfts: [], enemyNfts: [], busy: false };
        document.getElementById('pvp-battle-area').classList.add('hidden');
        renderPvpPlayers();
    }
    if (name === 'admin') {
        if (user.role !== 'admin') {
            showModal('🚫 Доступ запрещён', 'Только для админов');
            document.getElementById('view-main').classList.remove('hidden');
            return;
        }
        renderAdminPanel();
    }
}

function showModal(title, text, nftName) {
    document.getElementById('result-title').textContent = title;
    document.getElementById('result-text').textContent = text;
    const imgBox = document.getElementById('result-image');
    if (nftName) {
        const img = getNftImage(nftName);
        imgBox.innerHTML = img ? `<img src="${img}" alt="">` : '';
    } else {
        imgBox.innerHTML = '';
    }
    document.getElementById('result-modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('result-modal').classList.add('hidden'); }

document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('modal-close-btn');
    if (btn) btn.addEventListener('click', closeModal);
    const modal = document.getElementById('result-modal');
    if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function renderInventory() {
    const list = document.getElementById('inventory-list');
    if (!list || !user) return;
    if (!user.nft_inventory || !user.nft_inventory.length) {
        list.innerHTML = '<p class="empty">Инвентарь пуст. Открывай кейсы!</p>';
        return;
    }
    list.innerHTML = user.nft_inventory.map(nft => {
        const tier = getNftTier(nft);
        const img = getNftImage(nft);
        return `<div class="inventory-item tier${tier}">
            ${img ? `<img src="${img}" alt="">` : `<div style="font-size:50px;">${getTierEmoji(tier)}</div>`}
            <div class="nft-name">${escapeHtml(nft)}</div>
        </div>`;
    }).join('');
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================== АДМИН-ПАНЕЛЬ ================== */

    container.innerHTML = list.map(u => `
        <div class="admin-user">

                <b>${escapeHtml(u.name)}</b> @${escapeHtml(u.username)}

                ${u.blocked ? ' 🚫' : ''}<br>

            </div>
            <div class="admin-actions">
                <button class="admin-btn give" onclick="adminGive('${u.id}')">+⭐</button>
                <button class="admin-btn take" onclick="adminTake('${u.id}')">-⭐</button>
                <button class="admin-btn nft" onclick="adminGiveNft('${u.id}')">+🐒</button>
                <button class="admin-btn block" onclick="adminToggleBlock('${u.id}')">${u.blocked ? '✅' : '🚫'}</button>
            </div>
        </div>
    `).join('');
}

function adminGive(id) {
    const amount = parseInt(prompt('Сколько звёзд выдать?', '100'));
    if (!amount || amount <= 0) return;
    const users = getAllUsers();
    users[id].balance = (users[id].balance || 0) + amount;
    saveAllUsers(users);
    if (id === currentUserId) { user = users[id]; saveUser(); }
    renderAdminPanel();
}
function adminTake(id) {
    const amount = parseInt(prompt('Сколько звёзд снять?', '100'));
    if (!amount || amount <= 0) return;
    const users = getAllUsers();
    users[id].balance = Math.max(0, (users[id].balance || 0) - amount);
    saveAllUsers(users);
    if (id === currentUserId) { user = users[id]; saveUser(); }
    renderAdminPanel();
}
function adminGiveNft(id) {
    const name = prompt('Название NFT?', 'NFT Сердце 💌');
    if (!name) return;
    const users = getAllUsers();
    users[id].nft_inventory = users[id].nft_inventory || [];
    users[id].nft_inventory.push(name);
    saveAllUsers(users);
    if (id === currentUserId) { user = users[id]; saveUser(); }
    renderAdminPanel();
}
function adminToggleBlock(id) {
    const users = getAllUsers();
    users[id].blocked = !users[id].blocked;
    saveAllUsers(users);
    if (id === currentUserId) { user = users[id]; saveUser(); }
    renderAdminPanel();
}

/* ================== ИНИЦИАЛИЗАЦИЯ ================== */
function initApp() {
    document.getElementById('balance').textContent = user.balance;
    updateProfileUI();
    renderInventory();
    renderEvents();
    renderCases();
}

(function start() {
    const savedId = localStorage.getItem(CURRENT_KEY);
    if (savedId) {
        const users = getAllUsers();
        if (users[savedId] && !users[savedId].blocked) {
            user = users[savedId];
            currentUserId = savedId;
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initApp();
            return;
        } else {
            localStorage.removeItem(CURRENT_KEY);
        }
    }
    document.getElementById('auth-overlay').classList.remove('hidden');
})();
</script>
</body>
